<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUBeditotron3000</title>

<script src="app.js" defer></script>

<style type="text/css">
body  {
    font-size: 110%;
    font-family: system-ui, sans-serif;
}

#logo
{
    font-family: Calibri, sans-serif;
    font-weight: lighter;
    color: #505050;
    margin: 0.5em;
}

#editor
{
    max-width: 850px;
    margin: 0 auto;
    text-align: center;
    margin-top: 1em;
}

#output {
    font-size: 100%;
    padding: 0.2em;
    margin: 0.2em;
    font-family: system-ui, sans-serif;
    width: min(90%, 650px);
    box-sizing: border-box;
}

#content {
    font-size: 100%;
    padding: 0.2em;
    margin: 0.2em;
    font-family: system-ui, sans-serif;
    width: min(90%, 650px);
    box-sizing: border-box;
}

.operation {
    border: solid #d0d0d0 1px;
    background-color: #f0f0f0;
    padding: 0.9em;
    margin: 0.4em;
    width: 14em;
    cursor: pointer;
    border-radius: 8px;
}
</style>

</head>
<body>
<div id="editor">
    <div id="logo">
        QUBeditotron3000
    </div>
    <div>
        <textarea rows="5" cols="40" id="content" aria-label="Text to analyse">It was the best of cloud, it was the worst of cloud...</textarea>
    </div>
    <div>
        <input aria-label="Result" type="text" id="output" readonly="1" value="" />
    </div>
    <div>
        <button class="operation" onclick="handleAction('wordcount');">Word Count</button>
        <button class="operation" onclick="handleAction('charcount');">Character Count</button>
    </div>
    <div>
        <button class="operation" onclick="handleAction('vowelcount');">Vowel Count</button>
        <button class="operation" onclick="handleAction('commacount');">Comma Count</button>
    </div>
    <div>
        <button class="operation" onclick="handleAction('andcount');">And Count</button>
        <button class="operation" onclick="handleAction('palindromecount');">Palindrome Count</button>
    </div>
    <div>
        <button class="operation" onclick="saveText()">Save Text</button>
        <button class="operation" onclick="getText()">Get Text</button>
    </div>
    <div>
        <button class="operation" onclick="reloadConfig()">Reload Config</button>
        <button class="operation" onclick="checkServices()">Check Services</button>
    </div>
    <div>
        <button class="operation" onclick="fetchRecentPerformance()">Recent Performance</button>
    </div>

</div>
</body>


</html>
