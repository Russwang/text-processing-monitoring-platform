name: Test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/monitor/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s services/vowelcount/src -p 'test.py' -v
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: services/charcount
      - run: npm test
        working-directory: services/charcount
      - run: node --test tests/frontend.test.js
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test -v ./...
        working-directory: services/commacount
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.5.23'
          bundler-cache: true
          working-directory: services/andcount
      - run: bundle exec rspec
        working-directory: services/andcount
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/palindromecount/pom.xml
      - run: mvn --batch-mode verify
        working-directory: services/palindromecount
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm --no-deps wordcount php /var/www/html/test.php
      - run: docker compose up -d
      - run: python3 scripts/smoke_test.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
